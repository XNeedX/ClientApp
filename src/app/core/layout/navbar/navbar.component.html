<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/home" class="logo">InnoClinic</a>
  </div>
  
  <div class="navbar-menu">

    <a routerLink="/services" class="nav-link" routerLinkActive="active">Services</a>

    @if (isLoggedIn) {
      <button (click)="isAppointmentModalOpen = true" class="btn btn-success" style="margin-right: 15px;">
        Make an appointment
      </button>
      <a routerLink="/doctors" class="nav-link" routerLinkActive="active">Doctors</a>
      <a routerLink="/profile" class="nav-link" routerLinkActive="active">My Profile</a>
      <button (click)="logout()" class="btn btn-outline">Log out</button>
    } @else {
      <button (click)="login()" class="btn btn-primary">Log in</button>
    }
  </div>
</nav>

@if (isAppointmentModalOpen) {
  <app-appointment-modal (close)="isAppointmentModalOpen = false"></app-appointment-modal>
}
