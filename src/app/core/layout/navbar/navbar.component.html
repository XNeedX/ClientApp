<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/home" class="logo">InnoClinic</a>
  </div>
  
  <div class="navbar-menu">
    @if (isLoggedIn) {
      <a routerLink="/services" class="nav-link" routerLinkActive="active">Services</a>
      <a routerLink="/doctors" class="nav-link" routerLinkActive="active">Doctors</a>
      <button (click)="logout()" class="btn btn-outline">Log out</button>
    } @else {
      <button (click)="login()" class="btn btn-primary">Log in</button>
    }
  </div>
</nav>
