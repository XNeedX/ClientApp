<div class="service-list-container">
  <h2>Медицинские услуги: Консультации</h2>

  <!-- Состояние загрузки -->
  @if (isLoading()) {
    <div class="loader-container">
      <div class="spinner"></div>
      <p>Загрузка данных...</p>
    </div>
  } 
  
  <!-- Состояние ошибки -->
  @else if (errorMessage()) {
    <div class="error-alert">
      {{ errorMessage() }}
    </div>
  } 
  
  <!-- Состояние успешной загрузки -->
  @else if (categoryData()) {
    <div class="category-data-content">
      
      <!-- ВРЕМЕННЫЙ ВЫВОД: просто покажет все пришедшие данные как текст, 
           чтобы вы убедились, что запрос работает и 401 ошибки нет -->
      <pre class="debug-data">{{ categoryData() | json }}</pre>

      <!-- ПРИМЕР РЕАЛЬНОГО ВЫВОДА (раскомментируйте и подставьте свои поля из ViewCategoryDataDto): -->

      @if (categoryData()?.services?.length > 0) {

          @for (service of categoryData()?.services; track service.id) {
            <div class="service-card">
              <h3>{{ service.serviceName }}</h3>
              <p class="service-description">{{ service.description }}</p>
              <div class="service-footer">
                <span class="price">{{ service.price }} ₽</span>
                <button class="btn-book">Записаться</button>
              </div>
            </div>
          }
        </div>
      } @else {
        <p class="empty-state">В данной категории пока нет доступных услуг.</p>
      }
      -->

    </div>
  }
</div>
