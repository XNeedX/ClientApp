<div class="home-container">
  <div class="hero-section">
    <h1>Добро пожаловать в InnoClinic</h1>
    <p>Современный подход к вашему здоровью. Записывайтесь к лучшим специалистам в пару кликов.</p>
    
    <div class="action-buttons">
      @if (isLoggedIn) {
        <a routerLink="/doctors" class="btn btn-large btn-primary">Записаться к врачу</a>
        <a routerLink="/profile" class="btn btn-large btn-secondary">Перейти в профиль</a>
      } @else {
        <button (click)="login()" class="btn btn-large btn-primary">Авторизоваться для записи</button>
      }
    </div>
  </div>
</div>
